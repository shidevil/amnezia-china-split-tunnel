name: Build Amnezia lists

on:
  schedule:
    # Every 8 hours (UTC), at minute 37: GitHub delays scheduled runs at the start of every
    # hour and may drop them under load, and advises running at a different time of the hour.
    - cron: "37 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source(s) to build: 'all', or comma-separated names from config.yaml (e.g. cn-cidr,proxy)"
        type: string
        default: all
        required: false
      force:
        description: "Force rebuild: publish even if nothing changed"
        type: boolean
        default: false

# One build at a time; never cancel a run that is half-way through publishing.
concurrency:
  group: build-lists
  cancel-in-progress: false

# Deny everything by default; every job below asks for exactly what it needs.
permissions: {}

# An explicit shell makes GitHub run steps as `bash -eo pipefail`; the default is plain
# `bash -e`. tests/test_workflow_scripts.py runs the steps with the stricter form.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Resolve and validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read # checkout, and reading the previous release's build-info.json
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the previous build-info.json (to detect unchanged lists)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p previous
          # No tag: the release GitHub marks as the latest, which is what users download.
          gh release download --pattern build-info.json --dir previous \
            || echo "No previous release (first run?): every list will be published."

      - name: Build
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }} # only used for the GitHub API rate limit
          SOURCE: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "${SOURCE:-}" ] && [ "$SOURCE" != "all" ]; then
            # A single-source build merges into the last release's build-info.json, so that
            # file must exist and be usable: the generator refuses to guess (exit 2).
            args+=(--source "$SOURCE" --require-previous)
          fi
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          if [ -f previous/build-info.json ]; then
            args+=(--previous-build-info previous/build-info.json)
          fi
          python -m src.main "${args[@]}"

      # Stage everything the publish job needs in ONE directory, so the artifact layout
      # does not depend on how upload-artifact derives a root from several paths.
      - name: Stage release assets
        if: steps.build.outputs.publish == 'true'
        run: |
          mkdir release
          cp dist/*.json release/
          cp reports/release-notes.md release/

      - name: Upload release assets for the publish job
        if: steps.build.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish a new release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release, and delete the ones that fall out of the retention window
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_RELEASES: 28 # three builds a day: about nine days of releases to roll back to
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staging

      # Every release must hold every list, or `releases/latest/download/<list>` would stop
      # working the moment this release becomes the latest. The build only stages what
      # changed, so the other lists are taken from the release users get today.
      - name: Complete the asset set
        run: |
          jq -r '.sources[].file' staging/build-info.json > expected.txt
          while read -r name; do
            [ -f "staging/$name" ] && continue
            echo "$name did not change: taking it from the latest release"
            gh release download --pattern "$name" --dir staging || {
              echo "::error::$name was not rebuilt and is not on the latest release. Run this workflow with source=all and force=true."
              exit 1
            }
          done < expected.txt

      # build-info.json is the one list of what a release holds. Publish exactly that, and
      # only if every file is byte for byte what it says it is.
      - name: Check every asset against build-info.json
        run: |
          jq -r '.sources[] | "\(.file) \(.output_sha256)"' staging/build-info.json > expected.txt
          problems=0
          while read -r name want; do
            if [ ! -f "staging/$name" ]; then
              echo "::error::$name is listed in build-info.json but is missing"
              problems=1
              continue
            fi
            got=$(sha256sum "staging/$name" 2>/dev/null || shasum -a 256 "staging/$name")
            if [ "${got%% *}" = "$want" ]; then
              echo "ok  $name"
            else
              echo "::error::$name does not match the hash in build-info.json. Run this workflow with source=all and force=true to rebuild it."
              problems=1
            fi
          done < expected.txt
          for file in staging/*.json; do
            name=$(basename "$file")
            [ "$name" = build-info.json ] && continue
            cut -d' ' -f1 expected.txt | grep -qxF "$name" \
              || { echo "::error::$name is not listed in build-info.json"; problems=1; }
          done
          [ "$problems" = 0 ]

      # Tags are timestamps, so sorting the names sorts the releases by age.
      - name: Name the release
        run: echo "RELEASE_TAG=$(date -u +%Y-%m-%d-%H%M%S)" >> "$GITHUB_ENV"

      # The release is built as a DRAFT, which users cannot see. Nothing public changes until
      # the one call that publishes it, so a run that dies before then leaves users with the
      # release they already have. `gh release create` makes the draft and then uploads; if it
      # dies in between, the retry must top up that draft. `create` does not notice an
      # existing draft: it would make a second one with the same tag, and from then on every
      # lookup by tag is ambiguous. So the draft is looked up first, and a lookup that fails
      # counts as a failed attempt instead of as "no draft yet".
      - name: Create the draft release with every asset
        run: |
          make_draft() {
            drafts=$(gh release list --limit 500 --json tagName,isDraft \
              --jq "[.[] | select(.isDraft and .tagName == \"$RELEASE_TAG\")] | length") || return 1
            if [ "$drafts" = 0 ]; then
              gh release create "$RELEASE_TAG" staging/*.json --draft \
                --title "Lists built $(date -u '+%Y-%m-%d %H:%M UTC')" \
                --notes-file staging/release-notes.md --target "$GITHUB_SHA"
            elif [ "$drafts" = 1 ]; then
              gh release upload "$RELEASE_TAG" staging/*.json --clobber
            else
              echo "::error::$drafts drafts share the tag $RELEASE_TAG; refusing to guess which one to use"
              exit 1
            fi
          }
          for attempt in 1 2 3; do
            if make_draft; then exit 0; fi
            echo "::warning::attempt $attempt failed"
            sleep $((attempt * 15))
          done
          echo "::error::could not create the draft release"
          exit 1

      # Publish, this check and the cleanup all find the release by tag, so there must be
      # exactly one release with it. (`create` can succeed while its answer is lost.)
      - name: Verify the draft before publishing it
        run: |
          drafts=$(gh release list --limit 500 --json tagName,isDraft \
            --jq "[.[] | select(.isDraft and .tagName == \"$RELEASE_TAG\")] | length")
          if [ "$drafts" != 1 ]; then
            echo "::error::expected exactly one draft with the tag $RELEASE_TAG, found $drafts"
            exit 1
          fi
          for file in staging/*.json; do
            name=$(basename "$file")
            expected=$(($(wc -c < "$file")))
            actual=$(gh release view "$RELEASE_TAG" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .size")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name on the draft is ${actual:-missing} bytes, expected $expected"
              exit 1
            fi
            echo "ok  $name ($expected bytes)"
          done

      # One call: published and marked latest together.
      - name: Publish the release as the latest
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

      - name: Confirm the new release is the latest
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "::error::the latest release is $latest, not $RELEASE_TAG"
            exit 1
          fi
          echo "latest release: $latest"

      # Only published releases this workflow made (timestamp tags) are ever touched: never
      # the legacy `latest` release, never one made by hand, never the latest or the one just
      # published, and never a draft (invisible to users, so a leftover costs nothing, and
      # deleting by tag is ambiguous when a published release shares it).
      - name: Prune old releases
        continue-on-error: true # tidying the history must never fail a build
        run: |
          # `tail -n +1` keeps every line, so a limit of 0 or an empty one would delete all.
          # Leading zeros are refused too: 00 is zero, and 08 is an error in shell arithmetic.
          case "$KEEP_RELEASES" in
            '' | *[!0-9]* | 0*)
              echo "::error::KEEP_RELEASES must be a positive whole number, not '$KEEP_RELEASES'"
              exit 1
              ;;
          esac
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{6}$'
          latest=$(gh release view --json tagName --jq .tagName)
          gh release list --limit 500 --exclude-drafts --json tagName --jq '.[].tagName' \
            | { grep -E "$pattern" || true; } | sort -r \
            | tail -n +"$((KEEP_RELEASES + 1))" > old.txt
          while read -r tag; do
            if [ "$tag" = "$latest" ] || [ "$tag" = "$RELEASE_TAG" ]; then continue; fi
            gh release delete "$tag" --yes --cleanup-tag \
              || echo "::warning::could not delete release $tag"
          done < old.txt

      # Only ever a DRAFT: if the job failed after publishing (the prune, the confirmation),
      # the release is already what users download and must stay.
      - name: Delete the draft if the run did not finish
        if: (failure() || cancelled()) && env.RELEASE_TAG != ''
        run: |
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = true ]; then
            gh release delete "$RELEASE_TAG" --yes \
              || echo "::warning::could not delete the draft $RELEASE_TAG"
          fi

  keepalive:
    # GitHub disables scheduled workflows in public repositories after 60 days without
    # repository activity. Re-enabling the workflow on every scheduled run is a
    # best-effort way to keep the schedule alive. A failure here must never fail a build.
    name: Keep the schedule enabled
    needs: build
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/enable"
